name: toi-degree-validation

on:
  push:
    branches:
      - agent/cadq-initial-temporal-pruning

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify regression suite
        run: mvn -B test

      - name: Run shared-vs-differential acceleration campaign
        run: |
          set -o pipefail
          mkdir -p target/research
          mvn -B exec:java \
            -Dbouncingballs.commit="${GITHUB_SHA}-toi-degree-validation" \
            -Dexec.mainClass=io.github.eddytodd.bouncingballs.cli.CampaignCli \
            -Dexec.args="--workloads ACCELERATED,DIFFERENTIAL_ACCELERATION --balls 20,100 --seeds 3 --warmups 1 --repetitions 3 --duration 0.5 --out target/research/toi-degree.jsonl --overwrite" \
            2>&1 | tee target/research/toi-degree.log

      - name: Enforce polynomial-degree and correctness invariants
        run: |
          set -o pipefail
          python3 - <<'PY' | tee target/research/degree-summary.txt
          import json, statistics
          from collections import defaultdict
          from pathlib import Path

          rows = [json.loads(line) for line in Path('target/research/toi-degree.jsonl').read_text().splitlines() if line.strip()]
          summary = next(r for r in reversed(rows) if r.get('recordType') == 'summary')
          print('campaign_summary', json.dumps(summary, sort_keys=True))
          if not summary['passed']:
              raise SystemExit('differential scheduler campaign failed')

          measured = [r for r in rows if r.get('recordType') == 'trial']
          for r in measured:
              if r['toiQueries'] != r['pairToiQueries'] + r['wallToiQueries']:
                  raise SystemExit(f"TOI accounting mismatch: {r}")
              if r['pairToiQueries'] != r['quadraticPairToiQueries'] + r['quarticPairToiQueries']:
                  raise SystemExit(f"pair degree accounting mismatch: {r}")
              if r['workload'] == 'ACCELERATED' and r['quarticPairToiQueries'] != 0:
                  raise SystemExit(f"shared gravity unexpectedly produced quartic pair query: {r}")
              if r['workload'] == 'DIFFERENTIAL_ACCELERATION' and r['quadraticPairToiQueries'] != 0:
                  raise SystemExit(f"differential acceleration unexpectedly produced quadratic pair query: {r}")

          groups = defaultdict(list)
          for r in measured:
              groups[(r['workload'], r['requestedBalls'], r['algorithm'])].append(r)
          for key in sorted(groups):
              group = groups[key]
              print(key,
                    'trials=', len(group),
                    'pair_toi_median=', statistics.median(r['pairToiQueries'] for r in group),
                    'quadratic_median=', statistics.median(r['quadraticPairToiQueries'] for r in group),
                    'quartic_median=', statistics.median(r['quarticPairToiQueries'] for r in group),
                    'temporal_prunes_median=', statistics.median(r['cadqTemporalPrunes'] for r in group))
          PY

      - name: Preserve degree evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toi-degree-validation-${{ github.sha }}
          path: target/research/
          if-no-files-found: error
