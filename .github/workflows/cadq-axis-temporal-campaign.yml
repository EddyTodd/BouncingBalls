name: cadq-axis-temporal-campaign

on:
  push:
    branches:
      - agent/cadq-axis-temporal-pruning

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify regression suite
        run: mvn -B test

      - name: Run 100/300-ball radial-only baseline
        run: |
          set -o pipefail
          mkdir -p target/research
          mvn -B exec:java \
            -Dbouncingballs.commit="${GITHUB_SHA}-axis-off" \
            -Dbouncingballs.cadqAxisTemporalPruning=false \
            -Dexec.mainClass=io.github.eddytodd.bouncingballs.cli.CampaignCli \
            -Dexec.args="--workloads SPARSE_UNIFORM,DENSE_UNIFORM,CLUSTERED,HIGH_VELOCITY,WALL_DOMINATED,ACCELERATED,DIFFERENTIAL_ACCELERATION,ADVERSARIAL_INVALIDATION --balls 100,300 --seeds 3 --warmups 1 --repetitions 4 --duration 0.25 --out target/research/axis-off-100-300.jsonl --overwrite" \
            2>&1 | tee target/research/axis-off-100-300.log

      - name: Run 100/300-ball radial-plus-axis candidate
        run: |
          set -o pipefail
          mvn -B exec:java \
            -Dbouncingballs.commit="${GITHUB_SHA}-axis-on" \
            -Dbouncingballs.cadqAxisTemporalPruning=true \
            -Dexec.mainClass=io.github.eddytodd.bouncingballs.cli.CampaignCli \
            -Dexec.args="--workloads SPARSE_UNIFORM,DENSE_UNIFORM,CLUSTERED,HIGH_VELOCITY,WALL_DOMINATED,ACCELERATED,DIFFERENTIAL_ACCELERATION,ADVERSARIAL_INVALIDATION --balls 100,300 --seeds 3 --warmups 1 --repetitions 4 --duration 0.25 --out target/research/axis-on-100-300.jsonl --overwrite" \
            2>&1 | tee target/research/axis-on-100-300.log

      - name: Run 1000-ball radial-only baseline
        run: |
          set -o pipefail
          mvn -B exec:java \
            -Dbouncingballs.commit="${GITHUB_SHA}-axis-off-1000" \
            -Dbouncingballs.cadqAxisTemporalPruning=false \
            -Dexec.mainClass=io.github.eddytodd.bouncingballs.cli.CampaignCli \
            -Dexec.args="--workloads SPARSE_UNIFORM,DENSE_UNIFORM,HIGH_VELOCITY,WALL_DOMINATED,ACCELERATED,DIFFERENTIAL_ACCELERATION --balls 1000 --seeds 1 --warmups 0 --repetitions 1 --duration 0.10 --out target/research/axis-off-1000.jsonl --overwrite" \
            2>&1 | tee target/research/axis-off-1000.log

      - name: Run 1000-ball radial-plus-axis candidate
        run: |
          set -o pipefail
          mvn -B exec:java \
            -Dbouncingballs.commit="${GITHUB_SHA}-axis-on-1000" \
            -Dbouncingballs.cadqAxisTemporalPruning=true \
            -Dexec.mainClass=io.github.eddytodd.bouncingballs.cli.CampaignCli \
            -Dexec.args="--workloads SPARSE_UNIFORM,DENSE_UNIFORM,HIGH_VELOCITY,WALL_DOMINATED,ACCELERATED,DIFFERENTIAL_ACCELERATION --balls 1000 --seeds 1 --warmups 0 --repetitions 1 --duration 0.10 --out target/research/axis-on-1000.jsonl --overwrite" \
            2>&1 | tee target/research/axis-on-1000.log

      - name: Compare matched campaigns
        run: |
          set -o pipefail
          python3 benchmarks/compare_campaigns.py target/research/axis-off-100-300.jsonl target/research/axis-on-100-300.jsonl --balls 100 --bootstrap 20000 --seed 42 | tee target/research/comparison-100.txt
          python3 benchmarks/compare_campaigns.py target/research/axis-off-100-300.jsonl target/research/axis-on-100-300.jsonl --balls 300 --bootstrap 20000 --seed 42 | tee target/research/comparison-300.txt
          python3 benchmarks/compare_campaigns.py target/research/axis-off-1000.jsonl target/research/axis-on-1000.jsonl --balls 1000 --bootstrap 20000 --seed 42 | tee target/research/comparison-1000.txt

      - name: Summarize exact-work deltas
        run: |
          python3 - <<'PY' | tee target/research/mechanism-summary.txt
          import json, statistics
          from pathlib import Path

          def trials(path, balls):
              return [
                  r for r in (json.loads(line) for line in Path(path).read_text().splitlines() if line.strip())
                  if r.get('recordType') == 'trial'
                  and r.get('algorithm') == 'COMPUTE_AHEAD_DEPENDENCY_QUEUE'
                  and r.get('requestedBalls') == balls
              ]

          for balls, off_path, on_path in (
              (100, 'target/research/axis-off-100-300.jsonl', 'target/research/axis-on-100-300.jsonl'),
              (300, 'target/research/axis-off-100-300.jsonl', 'target/research/axis-on-100-300.jsonl'),
              (1000, 'target/research/axis-off-1000.jsonl', 'target/research/axis-on-1000.jsonl'),
          ):
              off = trials(off_path, balls)
              on = trials(on_path, balls)
              print('balls', balls, 'observations', len(on))
              for metric in ('toiQueries','pairToiQueries','quadraticPairToiQueries','quarticPairToiQueries','cadqTemporalBoundChecks','cadqTemporalPrunes'):
                  a = statistics.median(r[metric] for r in off)
                  b = statistics.median(r[metric] for r in on)
                  change = ((b / a) - 1.0) * 100.0 if a else float('nan')
                  print(metric, 'off_median=', a, 'on_median=', b, 'change_pct=', f'{change:.3f}')
          PY

      - name: Probe incremental axis rejection at initial wall horizons
        run: |
          cat > target/AxisMechanismProbe.java <<'JAVA'
          import io.github.eddytodd.bouncingballs.cli.Workloads;
          import io.github.eddytodd.bouncingballs.core.*;

          public final class AxisMechanismProbe {
              public static void main(String[] args) {
                  for (int n : new int[] {100, 300, 1000}) {
                      for (Workloads.Kind kind : new Workloads.Kind[] {
                              Workloads.Kind.SPARSE_UNIFORM,
                              Workloads.Kind.DENSE_UNIFORM,
                              Workloads.Kind.HIGH_VELOCITY,
                              Workloads.Kind.DIFFERENTIAL_ACCELERATION}) {
                          Workloads.Setup setup = Workloads.create(kind, n, 1, 1.0);
                          long checked = 0, radialRejected = 0, axisAdditional = 0, possible = 0;
                          for (int i = 0; i < setup.balls().size(); i++) {
                              Ball a = setup.balls().get(i);
                              double horizon = Double.POSITIVE_INFINITY;
                              for (int wall = 0; wall < 4; wall++) {
                                  horizon = Math.min(horizon, TimeOfImpact.wall(a, setup.bounds(), wall, NumericalPolicy.DEFAULT));
                              }
                              if (!Double.isFinite(horizon)) continue;
                              for (int j = i + 1; j < setup.balls().size(); j++) {
                                  Ball b = setup.balls().get(j);
                                  checked++;
                                  boolean radial = TemporalReachability.couldContactWithinRadial(a, b, horizon, NumericalPolicy.DEFAULT);
                                  if (!radial) {
                                      radialRejected++;
                                  } else if (!TemporalReachability.couldContactWithinAxes(a, b, horizon, NumericalPolicy.DEFAULT)) {
                                      axisAdditional++;
                                  } else {
                                      possible++;
                                  }
                              }
                          }
                          System.out.printf("%s n=%d checked=%d radialRejected=%d axisAdditional=%d possible=%d axisAdditionalPct=%.4f%n",
                                  kind, n, checked, radialRejected, axisAdditional, possible,
                                  checked == 0 ? 0.0 : 100.0 * axisAdditional / checked);
                      }
                  }
              }
          }
          JAVA
          javac -cp target/classes -d target target/AxisMechanismProbe.java
          java -cp target/classes:target AxisMechanismProbe | tee target/research/axis-mechanism-probe.txt

      - name: Enforce correctness gates
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = {
              'axis-off-100-300.jsonl', 'axis-on-100-300.jsonl',
              'axis-off-1000.jsonl', 'axis-on-1000.jsonl'
          }
          actual = {p.name for p in Path('target/research').glob('*.jsonl')}
          if actual != expected:
              raise SystemExit(f'campaign file mismatch: expected={expected}, actual={actual}')
          for path in sorted(Path('target/research').glob('*.jsonl')):
              rows = [json.loads(line) for line in path.read_text().splitlines() if line.strip()]
              summary = next(r for r in reversed(rows) if r.get('recordType') == 'summary')
              print(path.name, json.dumps(summary, sort_keys=True))
              if not summary['passed']:
                  raise SystemExit(f'{path.name} failed correctness gate')
          PY

      - name: Preserve axis evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cadq-axis-temporal-${{ github.sha }}
          path: target/research/
          if-no-files-found: error
