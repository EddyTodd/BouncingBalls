name: cadq-buffer-campaign

on:
  push:
    branches:
      - agent/cadq-phase-profile

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify regression suite
        run: mvn -B test
      - name: Run uninstrumented differential campaign
        id: campaign
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p target/research
          mvn -B exec:java \
            -Dbouncingballs.commit="${GITHUB_SHA}" \
            -Dexec.mainClass=io.github.eddytodd.bouncingballs.cli.CampaignCli \
            -Dexec.args="--workloads SPARSE_UNIFORM,DENSE_UNIFORM,CLUSTERED,HIGH_VELOCITY,WALL_DOMINATED,ACCELERATED,ADVERSARIAL_INVALIDATION --balls 20,100 --seeds 3 --warmups 1 --repetitions 5 --duration 1 --out target/research/campaign.jsonl --overwrite" \
            2>&1 | tee target/research/campaign-console.log
          exit ${PIPESTATUS[0]}
      - name: Summarize campaign
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' | tee target/research/campaign-summary.txt
          import json
          import statistics
          from collections import defaultdict
          from pathlib import Path

          path = Path('target/research/campaign.jsonl')
          if not path.exists():
              print('No campaign JSONL was produced.')
              raise SystemExit(0)
          records = [json.loads(line) for line in path.read_text().splitlines() if line.strip()]
          summary = next(r for r in reversed(records) if r.get('recordType') == 'summary')
          print('CAMPAIGN_SUMMARY', json.dumps(summary, sort_keys=True))

          trials = [r for r in records if r.get('recordType') == 'trial' and r.get('requestedBalls') == 100]
          groups = defaultdict(list)
          for row in trials:
              groups[row['algorithm']].append(row)
          for algorithm in sorted(groups):
              good = [r for r in groups[algorithm] if r.get('success')]
              print(algorithm,
                    'n=', len(good),
                    'total_ms=', f"{statistics.median(r['totalEngineNanos'] for r in good)/1e6:.6f}",
                    'construction_ms=', f"{statistics.median(r['constructionNanos'] for r in good)/1e6:.6f}",
                    'advance_ms=', f"{statistics.median(r['advanceNanos'] for r in good)/1e6:.6f}")
          PY
      - name: Preserve campaign evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cadq-buffer-campaign-${{ github.sha }}
          path: target/research/
          if-no-files-found: error
      - name: Enforce campaign result
        if: always()
        shell: bash
        env:
          CAMPAIGN_OUTCOME: ${{ steps.campaign.outcome }}
        run: |
          if [ "$CAMPAIGN_OUTCOME" != "success" ]; then
            echo "Campaign process failed; see preserved diagnostics."
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          records = [json.loads(line) for line in Path('target/research/campaign.jsonl').read_text().splitlines() if line.strip()]
          summary = next(r for r in reversed(records) if r.get('recordType') == 'summary')
          if not summary['passed']:
              raise SystemExit(json.dumps(summary, sort_keys=True))
          PY
