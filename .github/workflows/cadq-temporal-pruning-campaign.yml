name: cadq-temporal-pruning-campaign

on:
  push:
    branches:
      - agent/cadq-temporal-pruning

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify regression suite
        run: mvn -B test

      - name: Compile engine for in-process A/B
        run: mvn -B -DskipTests package

      - name: Build interleaved A/B harness
        shell: bash
        run: |
          mkdir -p target/research/ab/io/github/eddytodd/bouncingballs/cli
          cat > target/research/ab/io/github/eddytodd/bouncingballs/cli/TemporalPruningAb.java <<'JAVA'
          package io.github.eddytodd.bouncingballs.cli;

          import io.github.eddytodd.bouncingballs.core.*;
          import io.github.eddytodd.bouncingballs.research.StateSnapshot;
          import io.github.eddytodd.bouncingballs.resolver.ResolverKind;
          import io.github.eddytodd.bouncingballs.scheduler.SchedulerKind;
          import java.io.*;
          import java.nio.file.*;
          import java.util.*;

          public final class TemporalPruningAb {
              private static final String PROPERTY = "bouncingballs.cadqTemporalPruning";
              private static final Workloads.Kind[] WORKLOADS = {
                      Workloads.Kind.SPARSE_UNIFORM,
                      Workloads.Kind.DENSE_UNIFORM,
                      Workloads.Kind.CLUSTERED,
                      Workloads.Kind.HIGH_VELOCITY,
                      Workloads.Kind.WALL_DOMINATED,
                      Workloads.Kind.ACCELERATED,
                      Workloads.Kind.ADVERSARIAL_INVALIDATION
              };

              private record Run(
                      long constructionNanos,
                      long advanceNanos,
                      StateSnapshot snapshot,
                      long contacts,
                      long batches,
                      long contactHash,
                      long toiQueries,
                      long temporalChecks,
                      long temporalPrunes) {
                  long totalNanos() { return constructionNanos + advanceNanos; }
              }

              public static void main(String[] args) throws Exception {
                  Path out = Path.of("target/research/interleaved-ab.csv");
                  try (BufferedWriter writer = Files.newBufferedWriter(out)) {
                      writer.write("workload,balls,seed,repetition,enabledFirst,disabledConstruction,enabledConstruction,disabledAdvance,enabledAdvance,disabledTotal,enabledTotal,disabledToi,enabledToi,temporalChecks,temporalPrunes\n");
                      for (Workloads.Kind workload : WORKLOADS) {
                          for (int balls : new int[]{20, 100}) {
                              for (long seed = 1; seed <= 5; seed++) {
                                  for (int warmup = 0; warmup < 3; warmup++) {
                                      if ((warmup & 1) == 0) {
                                          run(workload, balls, seed, true);
                                          run(workload, balls, seed, false);
                                      } else {
                                          run(workload, balls, seed, false);
                                          run(workload, balls, seed, true);
                                      }
                                  }
                                  for (int repetition = 0; repetition < 20; repetition++) {
                                      boolean enabledFirst = (repetition & 1) == 0;
                                      Run enabled;
                                      Run disabled;
                                      if (enabledFirst) {
                                          enabled = run(workload, balls, seed, true);
                                          disabled = run(workload, balls, seed, false);
                                      } else {
                                          disabled = run(workload, balls, seed, false);
                                          enabled = run(workload, balls, seed, true);
                                      }
                                      verifyEquivalent(enabled, disabled, workload, balls, seed, repetition);
                                      writer.write(String.format(Locale.ROOT,
                                              "%s,%d,%d,%d,%s,%d,%d,%d,%d,%d,%d,%d,%d,%d,%d%n",
                                              workload, balls, seed, repetition, enabledFirst,
                                              disabled.constructionNanos, enabled.constructionNanos,
                                              disabled.advanceNanos, enabled.advanceNanos,
                                              disabled.totalNanos(), enabled.totalNanos(),
                                              disabled.toiQueries, enabled.toiQueries,
                                              enabled.temporalChecks, enabled.temporalPrunes));
                                  }
                              }
                          }
                      }
                  } finally {
                      System.clearProperty(PROPERTY);
                  }
              }

              private static Run run(Workloads.Kind workload, int balls, long seed, boolean enabled) {
                  System.setProperty(PROPERTY, Boolean.toString(enabled));
                  Workloads.Setup setup = Workloads.create(workload, balls, seed, 1.0);
                  long constructionStart = System.nanoTime();
                  Simulation simulation = new Simulation(
                          setup.balls(), setup.bounds(),
                          new SimulationConfig(
                                  SchedulerKind.COMPUTE_AHEAD_DEPENDENCY_QUEUE,
                                  ResolverKind.ITERATIVE,
                                  NumericalPolicy.DEFAULT,
                                  0.001));
                  long construction = System.nanoTime() - constructionStart;
                  long advanceStart = System.nanoTime();
                  simulation.advance(1.0, 100_000);
                  long advance = System.nanoTime() - advanceStart;
                  SimulationStats stats = simulation.stats();
                  return new Run(
                          construction,
                          advance,
                          StateSnapshot.capture(simulation),
                          stats.physicalContactsObserved,
                          stats.physicalContactBatches,
                          stats.physicalContactHash,
                          stats.toiQueries,
                          stats.cadqTemporalBoundChecks,
                          stats.cadqTemporalPrunes);
              }

              private static void verifyEquivalent(
                      Run enabled,
                      Run disabled,
                      Workloads.Kind workload,
                      int balls,
                      long seed,
                      int repetition) {
                  StateSnapshot.Difference difference = enabled.snapshot.compareTo(
                          disabled.snapshot, NumericalPolicy.DEFAULT, 100_000.0);
                  boolean history = enabled.contacts == disabled.contacts
                          && enabled.batches == disabled.batches
                          && enabled.contactHash == disabled.contactHash;
                  if (!history || !difference.equivalent()) {
                      throw new IllegalStateException("A/B physics mismatch: " + workload + "/" + balls + "/" + seed
                              + "/" + repetition + " history=" + history + " difference=" + difference);
                  }
              }
          }
          JAVA
          javac -cp target/classes -d target/research/ab target/research/ab/io/github/eddytodd/bouncingballs/cli/TemporalPruningAb.java

      - name: Run interleaved same-JVM A/B
        run: java -cp target/classes:target/research/ab io.github.eddytodd.bouncingballs.cli.TemporalPruningAb

      - name: Analyze paired A/B
        shell: bash
        run: |
          python3 - <<'PY' | tee target/research/interleaved-summary.txt
          import csv
          import math
          import random
          import statistics
          from collections import defaultdict
          from pathlib import Path

          rows = list(csv.DictReader(Path('target/research/interleaved-ab.csv').open()))
          rng = random.Random(44)

          def interval(log_ratios, n=20000):
              values = []
              size = len(log_ratios)
              for _ in range(n):
                  values.append(math.exp(sum(log_ratios[rng.randrange(size)] for _ in range(size)) / size))
              values.sort()
              return values[int(.025*n)], values[int(.975*n)]

          for balls in (20, 100):
              group = [r for r in rows if int(r['balls']) == balls]
              print('balls', balls, 'paired_samples', len(group))
              for label, disabled, enabled in (
                      ('construction', 'disabledConstruction', 'enabledConstruction'),
                      ('advance', 'disabledAdvance', 'enabledAdvance'),
                      ('total', 'disabledTotal', 'enabledTotal')):
                  logs = [math.log(int(r[enabled]) / int(r[disabled])) for r in group]
                  factor = math.exp(statistics.fmean(logs))
                  lo, hi = interval(logs)
                  print(label,
                        'factor=', f'{factor:.6f}',
                        'change_pct=', f'{(factor-1)*100:.3f}',
                        'ci=', f'{lo:.6f}-{hi:.6f}')
              disabled_toi = statistics.median(int(r['disabledToi']) for r in group)
              enabled_toi = statistics.median(int(r['enabledToi']) for r in group)
              prune_pct = statistics.median(
                      100.0 * int(r['temporalPrunes']) / int(r['temporalChecks'])
                      if int(r['temporalChecks']) else 0.0 for r in group)
              print('toi_median', disabled_toi, '->', enabled_toi,
                    'change_pct=', f'{(enabled_toi/disabled_toi-1)*100:.3f}',
                    'prune_pct_median=', f'{prune_pct:.3f}')

          for order in ('true', 'false'):
              group = [r for r in rows if r['enabledFirst'] == order and int(r['balls']) == 100]
              logs = [math.log(int(r['enabledAdvance']) / int(r['disabledAdvance'])) for r in group]
              print('100_ball_advance_enabledFirst=' + order,
                    'factor=', f'{math.exp(statistics.fmean(logs)):.6f}', 'n=', len(group))
          PY

      - name: Preserve interleaved evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cadq-temporal-pruning-interleaved-${{ github.sha }}
          path: target/research/
          if-no-files-found: error
