name: cadq-temporal-pruning-campaign

on:
  push:
    branches:
      - agent/cadq-temporal-pruning

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify regression suite
        run: mvn -B test

      - name: Run candidate first with temporal pruning
        shell: bash
        run: |
          mkdir -p target/research
          mvn -B exec:java \
            -Dbouncingballs.commit="${GITHUB_SHA}-pruning-enabled" \
            -Dbouncingballs.cadqTemporalPruning=true \
            -Dexec.mainClass=io.github.eddytodd.bouncingballs.cli.CampaignCli \
            -Dexec.args="--workloads SPARSE_UNIFORM,DENSE_UNIFORM,CLUSTERED,HIGH_VELOCITY,WALL_DOMINATED,ACCELERATED,ADVERSARIAL_INVALIDATION --balls 20,100 --seeds 5 --warmups 2 --repetitions 10 --duration 1 --out target/research/candidate.jsonl --overwrite" \
            2>&1 | tee target/research/candidate-console.log

      - name: Run baseline second without temporal pruning
        shell: bash
        run: |
          mvn -B exec:java \
            -Dbouncingballs.commit="${GITHUB_SHA}-pruning-disabled" \
            -Dbouncingballs.cadqTemporalPruning=false \
            -Dexec.mainClass=io.github.eddytodd.bouncingballs.cli.CampaignCli \
            -Dexec.args="--workloads SPARSE_UNIFORM,DENSE_UNIFORM,CLUSTERED,HIGH_VELOCITY,WALL_DOMINATED,ACCELERATED,ADVERSARIAL_INVALIDATION --balls 20,100 --seeds 5 --warmups 2 --repetitions 10 --duration 1 --out target/research/baseline.jsonl --overwrite" \
            2>&1 | tee target/research/baseline-console.log

      - name: Compare reversed-order replication
        shell: bash
        run: |
          python3 benchmarks/compare_campaigns.py target/research/baseline.jsonl target/research/candidate.jsonl --balls 20 --bootstrap 20000 --seed 43 | tee target/research/comparison-20.txt
          python3 benchmarks/compare_campaigns.py target/research/baseline.jsonl target/research/candidate.jsonl --balls 100 --bootstrap 20000 --seed 43 | tee target/research/comparison-100.txt

      - name: Summarize exact-work reduction
        shell: bash
        run: |
          python3 - <<'PY' | tee target/research/mechanism-summary.txt
          import json
          import statistics
          from pathlib import Path

          def trials(path):
              rows = [json.loads(line) for line in Path(path).read_text().splitlines() if line.strip()]
              return [r for r in rows if r.get('recordType') == 'trial'
                      and r.get('algorithm') == 'COMPUTE_AHEAD_DEPENDENCY_QUEUE']

          baseline = trials('target/research/baseline.jsonl')
          candidate = trials('target/research/candidate.jsonl')
          for balls in (20, 100):
              b = [r for r in baseline if r['requestedBalls'] == balls]
              c = [r for r in candidate if r['requestedBalls'] == balls]
              print('balls', balls, 'samples', len(c))
              for metric in ('toiQueries', 'candidateChecks'):
                  bm = statistics.median(r[metric] for r in b)
                  cm = statistics.median(r[metric] for r in c)
                  print(metric, 'baseline_median=', bm, 'candidate_median=', cm,
                        'change_pct=', f'{(cm / bm - 1.0) * 100.0:.3f}')
          PY

      - name: Enforce correctness gates
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ('candidate.jsonl', 'baseline.jsonl'):
              records = [json.loads(line) for line in Path('target/research', name).read_text().splitlines() if line.strip()]
              summary = next(r for r in reversed(records) if r.get('recordType') == 'summary')
              print(name, json.dumps(summary, sort_keys=True))
              if not summary['passed']:
                  raise SystemExit(f'{name} failed correctness gate')
          PY

      - name: Preserve replication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cadq-temporal-pruning-replication-${{ github.sha }}
          path: target/research/
          if-no-files-found: error
