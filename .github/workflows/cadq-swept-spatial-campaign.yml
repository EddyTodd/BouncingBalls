name: cadq-swept-spatial-campaign

on:
  push:
    branches:
      - agent/cadq-swept-spatial-grid

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify candidate regression suite
        run: mvn -B test

      - name: Run 100/300-ball temporal-only baseline
        run: |
          set -o pipefail
          mkdir -p target/research
          mvn -B exec:java \
            -Dbouncingballs.commit="${GITHUB_SHA}-spatial-off" \
            -Dbouncingballs.cadqSpatialPruning=false \
            -Dexec.mainClass=io.github.eddytodd.bouncingballs.cli.CampaignCli \
            -Dexec.args="--workloads SPARSE_UNIFORM,DENSE_UNIFORM,CLUSTERED,HIGH_VELOCITY,WALL_DOMINATED,ACCELERATED,DIFFERENTIAL_ACCELERATION,ADVERSARIAL_INVALIDATION --balls 100,300 --seeds 3 --warmups 1 --repetitions 4 --duration 0.25 --out target/research/spatial-off-100-300.jsonl --overwrite" \
            2>&1 | tee target/research/spatial-off-100-300.log

      - name: Run 100/300-ball swept-spatial candidate
        run: |
          set -o pipefail
          mvn -B exec:java \
            -Dbouncingballs.commit="${GITHUB_SHA}-spatial-on" \
            -Dbouncingballs.cadqSpatialPruning=true \
            -Dexec.mainClass=io.github.eddytodd.bouncingballs.cli.CampaignCli \
            -Dexec.args="--workloads SPARSE_UNIFORM,DENSE_UNIFORM,CLUSTERED,HIGH_VELOCITY,WALL_DOMINATED,ACCELERATED,DIFFERENTIAL_ACCELERATION,ADVERSARIAL_INVALIDATION --balls 100,300 --seeds 3 --warmups 1 --repetitions 4 --duration 0.25 --out target/research/spatial-on-100-300.jsonl --overwrite" \
            2>&1 | tee target/research/spatial-on-100-300.log

      - name: Run 1000-ball temporal-only baseline
        run: |
          set -o pipefail
          mvn -B exec:java \
            -Dbouncingballs.commit="${GITHUB_SHA}-spatial-off-1000" \
            -Dbouncingballs.cadqSpatialPruning=false \
            -Dexec.mainClass=io.github.eddytodd.bouncingballs.cli.CampaignCli \
            -Dexec.args="--workloads SPARSE_UNIFORM,DENSE_UNIFORM,HIGH_VELOCITY,WALL_DOMINATED,ACCELERATED,DIFFERENTIAL_ACCELERATION --balls 1000 --seeds 2 --warmups 0 --repetitions 1 --duration 0.10 --out target/research/spatial-off-1000.jsonl --overwrite" \
            2>&1 | tee target/research/spatial-off-1000.log

      - name: Run 1000-ball swept-spatial candidate
        run: |
          set -o pipefail
          mvn -B exec:java \
            -Dbouncingballs.commit="${GITHUB_SHA}-spatial-on-1000" \
            -Dbouncingballs.cadqSpatialPruning=true \
            -Dexec.mainClass=io.github.eddytodd.bouncingballs.cli.CampaignCli \
            -Dexec.args="--workloads SPARSE_UNIFORM,DENSE_UNIFORM,HIGH_VELOCITY,WALL_DOMINATED,ACCELERATED,DIFFERENTIAL_ACCELERATION --balls 1000 --seeds 2 --warmups 0 --repetitions 1 --duration 0.10 --out target/research/spatial-on-1000.jsonl --overwrite" \
            2>&1 | tee target/research/spatial-on-1000.log

      - name: Compare matched campaigns
        run: |
          set -o pipefail
          python3 benchmarks/compare_campaigns.py target/research/spatial-off-100-300.jsonl target/research/spatial-on-100-300.jsonl --balls 100 --bootstrap 20000 --seed 42 | tee target/research/comparison-100.txt
          python3 benchmarks/compare_campaigns.py target/research/spatial-off-100-300.jsonl target/research/spatial-on-100-300.jsonl --balls 300 --bootstrap 20000 --seed 42 | tee target/research/comparison-300.txt
          python3 benchmarks/compare_campaigns.py target/research/spatial-off-1000.jsonl target/research/spatial-on-1000.jsonl --balls 1000 --bootstrap 20000 --seed 42 | tee target/research/comparison-1000.txt

      - name: Summarize mechanism deltas
        run: |
          python3 - <<'PY' | tee target/research/mechanism-summary.txt
          import json, statistics
          from pathlib import Path

          def trials(path, balls):
              return [
                  r for r in (json.loads(line) for line in Path(path).read_text().splitlines() if line.strip())
                  if r.get('recordType') == 'trial'
                  and r.get('algorithm') == 'COMPUTE_AHEAD_DEPENDENCY_QUEUE'
                  and r.get('requestedBalls') == balls
              ]

          for balls, off_path, on_path in (
              (100, 'target/research/spatial-off-100-300.jsonl', 'target/research/spatial-on-100-300.jsonl'),
              (300, 'target/research/spatial-off-100-300.jsonl', 'target/research/spatial-on-100-300.jsonl'),
              (1000, 'target/research/spatial-off-1000.jsonl', 'target/research/spatial-on-1000.jsonl'),
          ):
              off = trials(off_path, balls)
              on = trials(on_path, balls)
              print('balls', balls, 'observations', len(on))
              for metric in ('toiQueries','pairToiQueries','quadraticPairToiQueries','quarticPairToiQueries','cadqTemporalBoundChecks','cadqTemporalPrunes'):
                  a = statistics.median(r[metric] for r in off)
                  b = statistics.median(r[metric] for r in on)
                  change = ((b / a) - 1.0) * 100.0 if a else float('nan')
                  print(metric, 'off_median=', a, 'on_median=', b, 'change_pct=', f'{change:.3f}')
          PY

      - name: Run direct spatial mechanism probe
        run: |
          cat > target/SpatialMechanismProbe.java <<'JAVA'
          import io.github.eddytodd.bouncingballs.cli.Workloads;
          import io.github.eddytodd.bouncingballs.core.*;
          import io.github.eddytodd.bouncingballs.resolver.ResolverKind;
          import io.github.eddytodd.bouncingballs.scheduler.SchedulerKind;

          public final class SpatialMechanismProbe {
              public static void main(String[] args) {
                  for (int n : new int[] {100, 300, 1000}) {
                      for (Workloads.Kind kind : new Workloads.Kind[] {
                              Workloads.Kind.SPARSE_UNIFORM,
                              Workloads.Kind.DENSE_UNIFORM,
                              Workloads.Kind.HIGH_VELOCITY,
                              Workloads.Kind.DIFFERENTIAL_ACCELERATION}) {
                          System.setProperty("bouncingballs.cadqSpatialPruning", "true");
                          Workloads.Setup setup = Workloads.create(kind, n, 1, 1.0);
                          Simulation sim = new Simulation(
                                  setup.balls(), setup.bounds(),
                                  new SimulationConfig(
                                          SchedulerKind.COMPUTE_AHEAD_DEPENDENCY_QUEUE,
                                          ResolverKind.ITERATIVE,
                                          NumericalPolicy.DEFAULT,
                                          0.001));
                          sim.advance(n == 1000 ? 0.10 : 0.25, 100000);
                          SimulationStats s = sim.stats();
                          System.out.printf(
                                  "%s n=%d gridRebuilds=%d maxCells=%d queries=%d cellVisits=%d candidates=%d excluded=%d excludePct=%.3f fallbacks=%d toi=%d temporalChecks=%d temporalPrunes=%d%n",
                                  kind, n,
                                  s.cadqSpatialGridRebuilds, s.cadqSpatialMaxGridCells,
                                  s.cadqSpatialQueries, s.cadqSpatialCellVisits,
                                  s.cadqSpatialCandidates, s.cadqSpatialPairsExcluded,
                                  s.cadqSpatialExcludePercent(), s.cadqSpatialFallbacks,
                                  s.toiQueries, s.cadqTemporalBoundChecks, s.cadqTemporalPrunes);
                      }
                  }
              }
          }
          JAVA
          javac -cp target/classes -d target target/SpatialMechanismProbe.java
          java -cp target/classes:target SpatialMechanismProbe | tee target/research/spatial-mechanism-probe.txt

      - name: Enforce correctness gates
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = {
              'spatial-off-100-300.jsonl', 'spatial-on-100-300.jsonl',
              'spatial-off-1000.jsonl', 'spatial-on-1000.jsonl'
          }
          actual = {p.name for p in Path('target/research').glob('*.jsonl')}
          if actual != expected:
              raise SystemExit(f'campaign file mismatch: expected={expected}, actual={actual}')
          for path in sorted(Path('target/research').glob('*.jsonl')):
              rows = [json.loads(line) for line in path.read_text().splitlines() if line.strip()]
              summary = next(r for r in reversed(rows) if r.get('recordType') == 'summary')
              print(path.name, json.dumps(summary, sort_keys=True))
              if not summary['passed']:
                  raise SystemExit(f'{path.name} failed correctness gate')
          PY

      - name: Preserve spatial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cadq-swept-spatial-${{ github.sha }}
          path: target/research/
          if-no-files-found: error
