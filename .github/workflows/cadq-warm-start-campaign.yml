name: cadq-warm-start-campaign

on:
  push:
    branches: [agent/cadq-warm-start-ordering]

permissions:
  contents: read

jobs:
  campaign:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile and test candidate
        run: mvn -B test

      - name: Run matched 100/300-body A/B
        shell: bash
        run: |
          set -uo pipefail
          workloads='SPARSE_UNIFORM,DENSE_UNIFORM,CLUSTERED,HIGH_VELOCITY,WALL_DOMINATED,ACCELERATED,DIFFERENTIAL_ACCELERATION,ADVERSARIAL_INVALIDATION'
          args="--workloads ${workloads} --balls 100,300 --seeds 3 --warmups 1 --repetitions 4 --duration 1 --events 100000 --out"

          mvn -q exec:java \
            -Dbouncingballs.commit="${GITHUB_SHA}" \
            -Dbouncingballs.cadqWarmStartOrdering=false \
            -Dexec.mainClass=io.github.eddytodd.bouncingballs.cli.CampaignCli \
            -Dexec.args="${args} warm-baseline-100-300.jsonl --overwrite"
          baseline_status=$?
          echo "baseline_status=${baseline_status}" | tee warm-status-100-300.txt

          mvn -q exec:java \
            -Dbouncingballs.commit="${GITHUB_SHA}" \
            -Dbouncingballs.cadqWarmStartOrdering=true \
            -Dexec.mainClass=io.github.eddytodd.bouncingballs.cli.CampaignCli \
            -Dexec.args="${args} warm-candidate-100-300.jsonl --overwrite"
          candidate_status=$?
          echo "candidate_status=${candidate_status}" | tee -a warm-status-100-300.txt

          if [[ ${baseline_status} -ne 0 || ${candidate_status} -ne 0 ]]; then
            exit 1
          fi

          set -e
          for n in 100 300; do
            python3 benchmarks/compare_campaigns.py \
              warm-baseline-100-300.jsonl warm-candidate-100-300.jsonl \
              --balls "${n}" --bootstrap 20000 --seed 42 \
              | tee "warm-compare-${n}.txt"
          done

      - name: Run bounded 1000-body A/B
        shell: bash
        run: |
          set -euo pipefail
          workloads='SPARSE_UNIFORM,HIGH_VELOCITY,DIFFERENTIAL_ACCELERATION'
          args="--workloads ${workloads} --balls 1000 --seeds 1 --warmups 1 --repetitions 2 --duration 0.5 --events 100000 --out"

          mvn -q exec:java \
            -Dbouncingballs.commit="${GITHUB_SHA}" \
            -Dbouncingballs.cadqWarmStartOrdering=false \
            -Dexec.mainClass=io.github.eddytodd.bouncingballs.cli.CampaignCli \
            -Dexec.args="${args} warm-baseline-1000.jsonl --overwrite"

          mvn -q exec:java \
            -Dbouncingballs.commit="${GITHUB_SHA}" \
            -Dbouncingballs.cadqWarmStartOrdering=true \
            -Dexec.mainClass=io.github.eddytodd.bouncingballs.cli.CampaignCli \
            -Dexec.args="${args} warm-candidate-1000.jsonl --overwrite"

          python3 benchmarks/compare_campaigns.py \
            warm-baseline-1000.jsonl warm-candidate-1000.jsonl \
            --balls 1000 --bootstrap 20000 --seed 42 \
            | tee warm-compare-1000.txt

      - name: Verify correctness summaries and record configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          files = [
              Path('warm-baseline-100-300.jsonl'),
              Path('warm-candidate-100-300.jsonl'),
              Path('warm-baseline-1000.jsonl'),
              Path('warm-candidate-1000.jsonl'),
          ]
          for path in files:
              records = [json.loads(line) for line in path.read_text().splitlines() if line.strip()]
              summaries = [r for r in records if r.get('recordType') == 'summary']
              assert len(summaries) == 1, (path, len(summaries))
              summary = summaries[0]
              assert summary['passed'] is True, (path, summary)
              assert summary['correctnessFailures'] == 0, (path, summary)
              assert summary['executionFailures'] == 0, (path, summary)
          PY

          cat > warm-start-config.txt <<EOF
          commit=${GITHUB_SHA}
          baseline=-Dbouncingballs.cadqWarmStartOrdering=false
          candidate=-Dbouncingballs.cadqWarmStartOrdering=true
          temporal-pruning=true (default)
          axis-temporal-pruning=true (default)
          100/300: eight stochastic workloads, 3 seeds, 1 warmup, 4 repetitions, duration 1s
          1000: SPARSE_UNIFORM,HIGH_VELOCITY,DIFFERENTIAL_ACCELERATION, 1 seed, 1 warmup, 2 repetitions, duration 0.5s
          EOF

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: cadq-warm-start-${{ github.sha }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            warm-*.jsonl
            warm-compare-*.txt
            warm-status-*.txt
            warm-start-config.txt
