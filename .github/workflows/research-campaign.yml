name: research-campaign

on:
  push:
    branches:
      - agent/post-cadq-evidence

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify regression suite
        run: mvn -B test
      - name: Run bounded scheduler campaign
        id: campaign
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p target/research
          mvn -B exec:java \
            -Dbouncingballs.commit="${GITHUB_SHA}" \
            -Dexec.mainClass=io.github.eddytodd.bouncingballs.cli.CampaignCli \
            -Dexec.args="--workloads SPARSE_UNIFORM,DENSE_UNIFORM,CLUSTERED,HIGH_VELOCITY,WALL_DOMINATED,ACCELERATED,ADVERSARIAL_INVALIDATION --balls 20,100 --seeds 3 --warmups 1 --repetitions 5 --duration 1 --out target/research/campaign.jsonl --overwrite" \
            > target/research/campaign-console.log 2>&1
      - name: Summarize campaign
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import statistics
          from collections import defaultdict
          from pathlib import Path

          path = Path('target/research/campaign.jsonl')
          records = [json.loads(line) for line in path.read_text().splitlines() if line.strip()]
          summary = next(r for r in reversed(records) if r.get('recordType') == 'summary')
          print('CAMPAIGN_SUMMARY', json.dumps(summary, sort_keys=True))

          trials = [r for r in records if r.get('recordType') == 'trial']
          failures = [r for r in trials if not r.get('success') or not r.get('equivalentToAllPairs')]
          for row in failures:
              print(
                  'MISMATCH',
                  row['workload'], row['requestedBalls'], row['seed'], row['algorithm'], row['repetition'],
                  'timeError=', row.get('simulationTimeError'),
                  'positionError=', row.get('maxPositionError'),
                  'velocityError=', row.get('maxVelocityError'),
                  'reason=', row.get('differenceReason', '')
              )

          groups = defaultdict(list)
          for row in trials:
              groups[(row['workload'], row['requestedBalls'], row['algorithm'])].append(row)

          metrics = {}
          for key, rows in groups.items():
              metrics[key] = {
                  'n': len(rows),
                  'failures': sum(1 for r in rows if not r.get('success') or not r.get('equivalentToAllPairs')),
                  'total_ms': statistics.median(r['totalEngineNanos'] for r in rows if r.get('success')) / 1e6,
                  'construct_ms': statistics.median(r['constructionNanos'] for r in rows if r.get('success')) / 1e6,
                  'advance_ms': statistics.median(r['advanceNanos'] for r in rows if r.get('success')) / 1e6,
                  'toi': statistics.median(r['toiQueries'] for r in rows if r.get('success')),
                  'stale_pct': statistics.median(r['stalePercent'] for r in rows if r.get('success')),
                  'full_reselect': statistics.median(r['cadqFullReselections'] for r in rows if r.get('success')),
                  'local_refresh': statistics.median(r['cadqLocalPairRefreshes'] for r in rows if r.get('success')),
                  'max_queue': statistics.median(r['maxQueueSize'] for r in rows if r.get('success')),
              }

          print('workload balls algorithm n failures total_ms construct_ms advance_ms toi stale_pct full_reselect local_refresh max_queue vs_allpairs vs_global')
          for key in sorted(metrics):
              workload, balls, algorithm = key
              m = metrics[key]
              allpairs = metrics[(workload, balls, 'ALL_PAIRS_CCD')]['total_ms']
              global_q = metrics[(workload, balls, 'GLOBAL_EVENT_QUEUE')]['total_ms']
              vs_allpairs = allpairs / m['total_ms'] if m['total_ms'] else float('inf')
              vs_global = global_q / m['total_ms'] if m['total_ms'] else float('inf')
              print(
                  f"{workload} {balls} {algorithm} {m['n']} {m['failures']} "
                  f"{m['total_ms']:.6f} {m['construct_ms']:.6f} {m['advance_ms']:.6f} "
                  f"{m['toi']:.0f} {m['stale_pct']:.3f} {m['full_reselect']:.0f} "
                  f"{m['local_refresh']:.0f} {m['max_queue']:.0f} {vs_allpairs:.3f} {vs_global:.3f}"
              )
          PY
      - name: Preserve raw campaign
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-cadq-campaign-${{ github.sha }}
          path: target/research/campaign.jsonl
          if-no-files-found: error
      - name: Enforce differential correctness
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          records = [json.loads(line) for line in Path('target/research/campaign.jsonl').read_text().splitlines() if line.strip()]
          summary = next(r for r in reversed(records) if r.get('recordType') == 'summary')
          if not summary['passed']:
              raise SystemExit(
                  f"campaign failed: {summary['correctnessFailures']} correctness mismatches, "
                  f"{summary['executionFailures']} execution failures")
          PY
