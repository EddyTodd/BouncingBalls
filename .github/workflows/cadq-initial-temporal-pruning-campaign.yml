name: cadq-initial-temporal-pruning-campaign

on:
  push:
    branches:
      - agent/cadq-initial-temporal-pruning

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout accepted master baseline
        uses: actions/checkout@v5
        with:
          ref: master
          path: baseline

      - name: Checkout construction-pruning candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: candidate

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: candidate/pom.xml

      - name: Verify candidate regression suite
        working-directory: candidate
        run: mvn -B test

      - name: Run 100/300-ball accepted baseline
        working-directory: baseline
        run: |
          mkdir -p ../evidence
          mvn -B exec:java \
            -Dbouncingballs.commit="master-advance-only-pruning" \
            -Dexec.mainClass=io.github.eddytodd.bouncingballs.cli.CampaignCli \
            -Dexec.args="--workloads SPARSE_UNIFORM,DENSE_UNIFORM,CLUSTERED,HIGH_VELOCITY,WALL_DOMINATED,ACCELERATED,ADVERSARIAL_INVALIDATION --balls 100,300 --seeds 2 --warmups 1 --repetitions 2 --duration 0.25 --out ../evidence/baseline-100-300.jsonl --overwrite" \
            2>&1 | tee ../evidence/baseline-100-300.log

      - name: Run 100/300-ball construction-pruning candidate
        working-directory: candidate
        run: |
          mvn -B exec:java \
            -Dbouncingballs.commit="${GITHUB_SHA}-construction-pruning" \
            -Dexec.mainClass=io.github.eddytodd.bouncingballs.cli.CampaignCli \
            -Dexec.args="--workloads SPARSE_UNIFORM,DENSE_UNIFORM,CLUSTERED,HIGH_VELOCITY,WALL_DOMINATED,ACCELERATED,ADVERSARIAL_INVALIDATION --balls 100,300 --seeds 2 --warmups 1 --repetitions 2 --duration 0.25 --out ../evidence/candidate-100-300.jsonl --overwrite" \
            2>&1 | tee ../evidence/candidate-100-300.log

      - name: Run 1000-ball accepted baseline
        working-directory: baseline
        run: |
          mvn -B exec:java \
            -Dbouncingballs.commit="master-advance-only-pruning" \
            -Dexec.mainClass=io.github.eddytodd.bouncingballs.cli.CampaignCli \
            -Dexec.args="--workloads SPARSE_UNIFORM,DENSE_UNIFORM,HIGH_VELOCITY,WALL_DOMINATED,ACCELERATED --balls 1000 --seeds 1 --warmups 0 --repetitions 1 --duration 0.10 --out ../evidence/baseline-1000.jsonl --overwrite" \
            2>&1 | tee ../evidence/baseline-1000.log

      - name: Run 1000-ball construction-pruning candidate
        working-directory: candidate
        run: |
          mvn -B exec:java \
            -Dbouncingballs.commit="${GITHUB_SHA}-construction-pruning" \
            -Dexec.mainClass=io.github.eddytodd.bouncingballs.cli.CampaignCli \
            -Dexec.args="--workloads SPARSE_UNIFORM,DENSE_UNIFORM,HIGH_VELOCITY,WALL_DOMINATED,ACCELERATED --balls 1000 --seeds 1 --warmups 0 --repetitions 1 --duration 0.10 --out ../evidence/candidate-1000.jsonl --overwrite" \
            2>&1 | tee ../evidence/candidate-1000.log

      - name: Compare matched campaigns
        working-directory: candidate
        run: |
          python3 benchmarks/compare_campaigns.py ../evidence/baseline-100-300.jsonl ../evidence/candidate-100-300.jsonl --balls 100 --bootstrap 20000 --seed 42 | tee ../evidence/comparison-100.txt
          python3 benchmarks/compare_campaigns.py ../evidence/baseline-100-300.jsonl ../evidence/candidate-100-300.jsonl --balls 300 --bootstrap 20000 --seed 42 | tee ../evidence/comparison-300.txt
          python3 benchmarks/compare_campaigns.py ../evidence/baseline-1000.jsonl ../evidence/candidate-1000.jsonl --balls 1000 --bootstrap 20000 --seed 42 | tee ../evidence/comparison-1000.txt

      - name: Summarize construction mechanism
        run: |
          python3 - <<'PY' | tee evidence/mechanism-summary.txt
          import json, statistics
          from pathlib import Path

          def trials(path):
              return [json.loads(line) for line in Path(path).read_text().splitlines()
                      if line.strip() and json.loads(line).get('recordType') == 'trial'
                      and json.loads(line).get('algorithm') == 'COMPUTE_AHEAD_DEPENDENCY_QUEUE']

          for label, baseline_path, candidate_path, balls in (
              ('100', 'evidence/baseline-100-300.jsonl', 'evidence/candidate-100-300.jsonl', 100),
              ('300', 'evidence/baseline-100-300.jsonl', 'evidence/candidate-100-300.jsonl', 300),
              ('1000', 'evidence/baseline-1000.jsonl', 'evidence/candidate-1000.jsonl', 1000),
          ):
              b = [r for r in trials(baseline_path) if r['requestedBalls'] == balls]
              c = [r for r in trials(candidate_path) if r['requestedBalls'] == balls]
              print('balls', label, 'observations', len(c))
              for metric in ('constructionNanos','advanceNanos','totalEngineNanos','toiQueries','cadqTemporalBoundChecks','cadqTemporalPrunes'):
                  bm = statistics.median(r[metric] for r in b)
                  cm = statistics.median(r[metric] for r in c)
                  change = ((cm / bm) - 1.0) * 100.0 if bm else float('nan')
                  print(metric, 'baseline_median=', bm, 'candidate_median=', cm, 'change_pct=', f'{change:.3f}')
          PY

      - name: Enforce correctness gates
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in Path('evidence').glob('*.jsonl'):
              records = [json.loads(line) for line in path.read_text().splitlines() if line.strip()]
              summary = next(r for r in reversed(records) if r.get('recordType') == 'summary')
              print(path.name, json.dumps(summary, sort_keys=True))
              if not summary['passed']:
                  raise SystemExit(f'{path.name} failed correctness gate')
          PY

      - name: Preserve scale evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cadq-initial-temporal-pruning-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
